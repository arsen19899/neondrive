name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Собрать и опубликовать APK
    runs-on: ubuntu-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Переименовать для удобства
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk     out/NeonDrive-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/NeonDrive-release.apk || true
          ls -lh out

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: NeonDrive-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Выложить в релиз «latest»
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: NeonDrive — последняя сборка
          files: out/*.apk
          make_latest: true
